[project]
name = "boli-zero"
version = "0.1.0"
description = "Experimental adapter layer from a standard Indian-language voice stack to unsupported regional languages (Hindi to Bhojpuri first)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boli_zero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
